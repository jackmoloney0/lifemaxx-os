function useCountdown() {
  const [t, setT] = useState({});
  useEffect(() => {
    const calc = () => {
      const diff = DEADLINE - new Date();
      if (diff <= 0) return setT({ days: 0, hours: 0, mins: 0, secs: 0 });
      setT({ days: Math.floor(diff / 86400000), hours: Math.floor((diff % 86400000) / 3600000), mins: Math.floor((diff % 3600000) / 60000), secs: Math.floor((diff % 60000) / 1000) });
    };
    calc();
    const id = setInterval(calc, 1000);
    return () => clearInterval(id);
  }, []);
  return t;
}

function XPPopup({ amount, color, onDone }) {
  useEffect(() => { const t = setTimeout(onDone, 1200); return () => clearTimeout(t); }, []);
  return (
    <div style={{ position: "fixed", top: "40%", left: "50%", transform: "translateX(-50%)", zIndex: 9999, pointerEvents: "none", animation: "floatUp 1.2s ease forwards", fontSize: "22px", fontWeight: "900", color, fontFamily: "Courier New", textShadow: "0 0 20px " + color }}>
      +{amount} XP
    </div>
  );
}

function StreakBadge({ streak }) {
  if (!streak) return null;
  const fire = streak >= 7 ? "\uD83D\uDD25" : streak >= 3 ? "\u26A1" : "\u2726";
  return <span style={{ fontSize: "11px", color: "#f59e0b", marginLeft: "8px" }}>{fire} {streak} day streak</span>;
}

          </div>
        )}

        <div style={{ display:"flex",gap:"4px",marginBottom:"20px",flexWrap:"wrap" }}>
          {["goals","reading","identity","weekly"].map(tab=>(
            <button key={tab} onClick={()=>setActiveTab(tab)} style={{
              background:activeTab===tab?"#f59e0b":"rgba(255,255,255,0.02)",
              color:activeTab===tab?"#000":"#444",
              border:"1px solid "+(activeTab===tab?"#f59e0b":"#111"),
              padding:"8px 18px",borderRadius:"3px",cursor:"pointer",
              fontSize:"9px",letterSpacing:"2px",fontFamily:"inherit",fontWeight:"bold",textTransform:"uppercase"
            }}>{tab}{tab==="reading"?" ("+totalReadingPct+"%)":""}</button>
          ))}
        </div>

        {activeTab==="goals" && (
          <div style={{ display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:"10px" }}>
            {goals.map(goal=>{
              const done=goal.milestones.filter(m=>m.done).length;
              const pct=Math.round((done/goal.milestones.length)*100);
              const earnedXP=Math.floor(goal.xp*(done/goal.milestones.length));
              const isActive=activeGoal===goal.id;
              return (
                <div key={goal.id} onClick={()=>setActiveGoal(isActive?null:goal.id)} style={{
                  background:isActive?"rgba(255,255,255,0.03)":"rgba(255,255,255,0.015)",
                  border:"1px solid "+(isActive?goal.color:"#0f0f0f"),
                  borderRadius:"4px",padding:"18px",cursor:"pointer",transition:"border-color 0.2s",
                  gridColumn:isActive?"1 / -1":"auto",
                }}>
                  <div style={{ display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"10px" }}>
                    <div>
                      <span style={{ fontSize:"16px",marginRight:"8px" }}>{goal.icon}</span>
                      <span style={{ fontSize:"13px",fontWeight:"bold" }}>{goal.title}</span>
                    </div>
                    <span style={{ fontSize:"9px",color:goal.color,background:goal.color+"18",padding:"3px 8px",borderRadius:"2px",letterSpacing:"1px",flexShrink:0 }}>{earnedXP} XP</span>
                  </div>
                  <div style={{ fontSize:"10px",color:goal.color,marginBottom:"10px",fontWeight:"bold" }}>{"\u25B6"} {goal.target}</div>
                  <div style={{ display:"flex",justifyContent:"space-between",marginBottom:"5px" }}>
                    <span style={{ fontSize:"9px",color:"#2a2a2a" }}>{done}/{goal.milestones.length}</span>
                    <span style={{ fontSize:"9px",color:goal.color }}>{pct}%</span>
                  </div>
                  <div style={{ height:"3px",background:"#0f0f0f",borderRadius:"2px" }}>
                    <div style={{ height:"100%",width:pct+"%",background:goal.color,borderRadius:"2px",transition:"width 0.4s" }} />
                  </div>
                  {!isActive && <div style={{ fontSize:"9px",color:"#1a1a1a",marginTop:"10px" }}>CLICK TO EXPAND {"\u2192"}</div>}
                  {isActive && (
                    <div style={{ marginTop:"20px",borderTop:"1px solid #111",paddingTop:"20px" }}>
                      <div style={{ display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))",gap:"10px",marginBottom:"20px" }}>
                        <div style={{ background:"rgba(255,255,255,0.02)",border:"1px solid #111",borderRadius:"4px",padding:"12px" }}>
                          <div style={{ fontSize:"9px",color:goal.color,letterSpacing:"3px",marginBottom:"6px" }}>IDENTITY</div>
                          <p style={{ fontSize:"12px",color:"#888",margin:0,fontStyle:"italic" }}>"{goal.identity}"</p>
                        </div>
                        <div style={{ background:"rgba(239,68,68,0.04)",border:"1px solid rgba(239,68,68,0.1)",borderRadius:"4px",padding:"12px" }}>
                          <div style={{ fontSize:"9px",color:"#ef4444",letterSpacing:"3px",marginBottom:"6px" }}>ANTI-GOAL</div>
                          <p style={{ fontSize:"12px",color:"#777",margin:0 }}>{goal.antiGoal}</p>
                        </div>
                        <div style={{ background:"rgba(16,185,129,0.04)",border:"1px solid rgba(16,185,129,0.1)",borderRadius:"4px",padding:"12px" }}>
                          <div style={{ fontSize:"9px",color:"#10b981",letterSpacing:"3px",marginBottom:"6px" }}>WEEKLY INPUTS</div>
                          {goal.weeklyInputs.map((w,i)=><div key={i} style={{ fontSize:"11px",color:"#444",marginBottom:"4px" }}>{"\u2192"} {w}</div>)}
                        </div>
                        <div style={{ background:"rgba(255,255,255,0.02)",border:"1px solid #111",borderRadius:"4px",padding:"12px" }}>
                          <div style={{ fontSize:"9px",color:"#f59e0b",letterSpacing:"3px",marginBottom:"6px" }}>STRATEGY</div>
                          <p style={{ fontSize:"11px",color:"#555",margin:0,lineHeight:1.7 }}>{goal.strategy}</p>
                        </div>
                      </div>
                      <div style={{ fontSize:"9px",color:"#222",letterSpacing:"3px",marginBottom:"10px" }}>MILESTONES + METRICS</div>
                      {goal.milestones.map((m,i)=>(
                        <div key={i} onClick={e=>{e.stopPropagation();toggleMilestone(goal.id,i);}} style={{
                          display:"flex",alignItems:"flex-start",gap:"12px",
                          padding:"12px",marginBottom:"6px",
                          background:m.done?goal.color+"0d":"rgba(255,255,255,0.01)",
                          border:"1px solid "+(m.done?goal.color+"40":"#111"),
                          borderRadius:"4px",cursor:"pointer",transition:"all 0.2s",
                        }}>
                          <div style={{ width:"16px",height:"16px",flexShrink:0, border:"2px solid "+(m.done?goal.color:"#1f1f1f"), borderRadius:"2px",background:m.done?goal.color:"transparent", display:"flex",alignItems:"center",justifyContent:"center",marginTop:"2px" }}>
                            {m.done&&<span style={{ fontSize:"9px",color:"#000",fontWeight:"900" }}>{"\u2713"}</span>}
                          </div>
                          <div style={{ flex:1 }}>
                            <div style={{ fontSize:"12px",color:m.done?"#444":"#ccc",textDecoration:m.done?"line-through":"none",marginBottom:"3px",lineHeight:1.5 }}>{m.label}</div>
                            <div style={{ fontSize:"9px",color:m.done?goal.color:"#1f1f1f" }}>METRIC: {m.metric}</div>
                          </div>
                          {m.done&&<span style={{ fontSize:"9px",color:goal.color,flexShrink:0 }}>+{Math.floor(goal.xp/goal.milestones.length)} XP</span>}
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}

        {activeTab==="reading" && (
          <div>
            <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"20px" }}>
              <div>
                <div style={{ fontSize:"9px",color:"#f97316",letterSpacing:"4px",marginBottom:"4px" }}>READING TRACKER // 2 BOOKS PER MONTH TARGET</div>
                <div style={{ fontSize:"12px",color:"#333" }}>Update your page progress. Earn XP as you read.</div>
              </div>
              <div style={{ textAlign:"right" }}>
                <div style={{ fontSize:"9px",color:"#333",letterSpacing:"2px",marginBottom:"2px" }}>READING XP</div>
                <div style={{ fontSize:"22px",fontWeight:"900",color:"#f97316" }}>{readingXP}</div>
              </div>
            </div>

            <div style={{ background:"rgba(249,115,22,0.06)",border:"1px solid rgba(249,115,22,0.15)",borderRadius:"4px",padding:"16px",marginBottom:"20px" }}>
              <div style={{ display:"flex",justifyContent:"space-between",marginBottom:"8px" }}>
                <span style={{ fontSize:"10px",color:"#f97316",letterSpacing:"2px" }}>OVERALL READING PROGRESS</span>
                <span style={{ fontSize:"10px",color:"#f97316" }}>{totalReadingPct}%</span>
              </div>
              <div style={{ height:"6px",background:"#111",borderRadius:"3px",overflow:"hidden" }}>
                <div style={{ height:"100%",width:totalReadingPct+"%",background:"linear-gradient(90deg,#f97316,#f59e0b)",transition:"width 0.5s" }} />
              </div>
              <div style={{ fontSize:"9px",color:"#222",marginTop:"6px" }}>
                {readingBooks.reduce((a,b)=>a+b.pagesRead,0)} / {readingBooks.reduce((a,b)=>a+b.pages,0)} pages across all books
              </div>
            </div>

            <div style={{ display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:"10px" }}>
              {readingBooks.map((book,idx)=>{
                const pct=Math.round((book.pagesRead/book.pages)*100);
                const xpEarned=Math.floor(300*Math.min(book.pagesRead/book.pages,1));
                return (
                  <div key={idx} style={{ background:"rgba(255,255,255,0.015)",border:"1px solid #0f0f0f",borderTop:"3px solid "+book.color,borderRadius:"4px",padding:"18px" }}>
                    <div style={{ display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"12px" }}>
                      <div>
                        <div style={{ fontSize:"12px",fontWeight:"bold",color:"#ddd",marginBottom:"2px" }}>{book.title}</div>
                        <div style={{ fontSize:"10px",color:"#333" }}>{book.author}</div>
                      </div>
                      <span style={{ fontSize:"9px",color:book.color,background:book.color+"18",padding:"3px 8px",borderRadius:"2px",letterSpacing:"1px",flexShrink:0 }}>{xpEarned} XP</span>
                    </div>

                    <div style={{ marginBottom:"12px" }}>
                      <div style={{ display:"flex",justifyContent:"space-between",marginBottom:"5px" }}>
                        <span style={{ fontSize:"9px",color:"#333" }}>PAGES: {book.pagesRead}/{book.pages}</span>
                        <span style={{ fontSize:"9px",color:book.color }}>{pct}%</span>
                      </div>
                      <div style={{ height:"4px",background:"#111",borderRadius:"2px" }}>
                        <div style={{ height:"100%",width:pct+"%",background:book.color,borderRadius:"2px",transition:"width 0.3s" }} />
                      </div>
                    </div>

                    <div style={{ marginBottom:"14px" }}>
                      <input
                        type="range" min="0" max={book.pages} value={book.pagesRead}
                        onChange={e=>{e.stopPropagation();updateBookPages(idx,parseInt(e.target.value));}}
                        onClick={e=>e.stopPropagation()}
                        style={{ width:"100%",accentColor:book.color,background:"linear-gradient(to right, "+book.color+" "+pct+"%, #111 "+pct+"%)" }}
                      />
                    </div>

                    <div style={{ display:"flex",gap:"4px",marginBottom:"12px" }}>
                      {[0,25,50,75,100].map(p=>(
                        <button key={p} onClick={e=>{e.stopPropagation();updateBookPages(idx,Math.floor(book.pages*(p/100)));}} style={{
                          flex:1,background:pct===p?book.color:"rgba(255,255,255,0.02)",
                          color:pct===p?"#000":book.color, border:"1px solid "+(pct===p?book.color:"#1a1a1a"),
                          borderRadius:"2px",padding:"4px 0",fontSize:"9px",cursor:"pointer",fontFamily:"inherit"
                        }}>{p}%</button>
                      ))}
                    </div>

                    <div style={{ background:"rgba(255,255,255,0.02)",border:"1px solid #111",borderRadius:"3px",padding:"8px 10px" }}>
                      <div style={{ fontSize:"9px",color:book.color,letterSpacing:"2px",marginBottom:"3px" }}>IMPLEMENT</div>
                      <div style={{ fontSize:"10px",color:"#444",lineHeight:1.5 }}>{book.goal}</div>
                    </div>

                    {pct===100 && (
                      <div style={{ marginTop:"10px",display:"flex",alignItems:"center",gap:"6px",color:"#10b981",fontSize:"10px" }}>
                        <span>{"\u2726"}</span> COMPLETE {"\u2014"} +300 XP EARNED
                      </div>
                    )}
                  </div>
                );
              })}
            </div>

            <div style={{ marginTop:"24px",background:"rgba(249,115,22,0.04)",border:"1px solid rgba(249,115,22,0.12)",borderRadius:"4px",padding:"22px" }}>
              <div style={{ fontSize:"9px",color:"#f97316",letterSpacing:"4px",marginBottom:"16px" }}>WEEKLY READING DISCIPLINE</div>
              <div style={{ display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))",gap:"12px" }}>
                {[
                  { label:"Daily minimum",val:"30 pages / day",icon:"\uD83D\uDCD6" },
                  { label:"Weekly target",val:"210 pages / week",icon:"\uD83C\uDFAF" },
                  { label:"Monthly books",val:"2 books / month",icon:"\uD83D\uDCDA" },
                  { label:"Annual target",val:"24 books by Jul 2026",icon:"\uD83C\uDFC6" },
                ].map((item,i)=>(
                  <div key={i} style={{ display:"flex",alignItems:"center",gap:"10px",padding:"12px",background:"rgba(255,255,255,0.02)",border:"1px solid #111",borderRadius:"4px" }}>
                    <span style={{ fontSize:"18px" }}>{item.icon}</span>
                    <div>
                      <div style={{ fontSize:"9px",color:"#333",letterSpacing:"2px",marginBottom:"2px" }}>{item.label.toUpperCase()}</div>
                      <div style={{ fontSize:"12px",fontWeight:"bold",color:"#f97316" }}>{item.val}</div>
                    </div>
                  </div>
                ))}
              </div>
              <div style={{ marginTop:"16px",borderTop:"1px solid #111",paddingTop:"14px" }}>
                <div style={{ fontSize:"9px",color:"#333",letterSpacing:"2px",marginBottom:"8px" }}>READING RULES (NON-NEGOTIABLE)</div>
                {[
                  "Never finish a book without writing 1 action you'll take THIS WEEK because of it",
                  "Read with a purpose \u2014 what problem are you trying to solve right now?",
                  "Add every insight that could change your behaviour to your 'swipe file'",
                  "Implementation gap is where all value is lost. Read less, implement more.",
                ].map((r,i)=>(
                  <div key={i} style={{ fontSize:"11px",color:"#2a2a2a",marginBottom:"6px" }}>{"\u2192"} {r}</div>
                ))}
              </div>
            </div>
          </div>
        )}

        {activeTab==="identity" && (
          <div>
            <div style={{ fontSize:"9px",color:"#f59e0b",letterSpacing:"4px",marginBottom:"8px" }}>WHO YOU ARE BECOMING</div>
            <p style={{ fontSize:"12px",color:"#2a2a2a",margin:"0 0 20px",lineHeight:1.8 }}>Identity change is the meta-skill. When you change who you ARE, behaviour change becomes automatic. Read these every morning.</p>
            {IDENTITY.map((s,i)=>(
              <div key={i} style={{ display:"flex",alignItems:"flex-start",gap:"14px",padding:"16px",marginBottom:"6px",background:"rgba(255,255,255,0.015)",border:"1px solid #0f0f0f",borderRadius:"4px" }}>
                <div style={{ width:"24px",height:"24px",flexShrink:0,background:"rgba(245,158,11,0.08)",border:"1px solid rgba(245,158,11,0.2)",borderRadius:"3px",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"10px",color:"#f59e0b",fontWeight:"bold" }}>{i+1}</div>
                <div style={{ fontSize:"13px",color:"#bbb",fontStyle:"italic",lineHeight:1.6 }}>"{s}"</div>
              </div>
            ))}
            <div style={{ marginTop:"24px",background:"rgba(255,255,255,0.015)",border:"1px solid #0f0f0f",borderRadius:"4px",padding:"22px" }}>
              <div style={{ fontSize:"9px",color:"#8b5cf6",letterSpacing:"4px",marginBottom:"16px" }}>5 OPERATING PRINCIPLES</div>
              {[
                { model:"Asymmetric Bets", desc:"Every project has a capped downside (10 days) and uncapped upside (life-changing). Stack them relentlessly." },
                { model:"Expected Value Thinking", desc:"P(success) \u00D7 value if success. Cold emailing a founder: 5% chance, life-changing outcome. The math says always do it." },
                { model:"Hard Fork Moments", desc:"You're at one right now. The decisions you make at 19 set the entire trajectory. Most people underestimate how much this moment matters." },
                { model:"Surface Area for Luck", desc:"Luck = preparation \u00D7 exposure. Every public artefact is a lottery ticket that never expires. Ship publicly, always." },
                { model:"Skin In The Game", desc:"Announce goals publicly. The embarrassment of failing publicly is a stronger motivator than any productivity system ever built." },
              ].map((m,i)=>(
                <div key={i} style={{ borderLeft:"2px solid #8b5cf6",paddingLeft:"14px",marginBottom:"16px" }}>
                  <div style={{ fontSize:"10px",fontWeight:"bold",color:"#8b5cf6",marginBottom:"3px",letterSpacing:"1px" }}>{m.model}</div>
                  <div style={{ fontSize:"11px",color:"#3a3a3a",lineHeight:1.7 }}>{m.desc}</div>
                </div>
              ))}
            </div>
          </div>
        )}

        {activeTab==="weekly" && (
          <div>
            <div style={{ fontSize:"9px",color:"#f59e0b",letterSpacing:"4px",marginBottom:"16px" }}>WEEKLY OPERATING SYSTEM</div>
            <div style={{ display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(185px,1fr))",gap:"8px",marginBottom:"22px" }}>
              {[
                { day:"MON",color:"#f59e0b",tasks:["Deep work: Build (2hr min)","5 cold outreach messages","Portfolio project sprint"] },
                { day:"TUE",color:"#ef4444",tasks:["Film YouTube content","Customer discovery call","Read 30 pages + write 1 insight"] },
                { day:"WED",color:"#8b5cf6",tasks:["AI tool experimentation","Major project progress","LinkedIn/GitHub update"] },
                { day:"THU",color:"#3b82f6",tasks:["Business: validate or build","Cold email batch + follow-ups","Deep work: Create (2hr min)"] },
                { day:"FRI",color:"#10b981",tasks:["Ship something publicly","Weekly metrics review","Plan next week's targets"] },
                { day:"SAT",color:"#f97316",tasks:["Long deep build session (3hr)","Read long-form / books","What moved the needle?"] },
                { day:"SUN",color:"#444",tasks:["Rest intentionally","6 review questions below","Set Monday's #1 priority"] },
              ].map(d=>(
                <div key={d.day} style={{ background:"rgba(255,255,255,0.015)",border:"1px solid #0f0f0f",borderTop:"3px solid "+d.color,borderRadius:"4px",padding:"14px" }}>
                  <div style={{ fontSize:"10px",fontWeight:"bold",color:d.color,letterSpacing:"3px",marginBottom:"10px" }}>{d.day}</div>
                  {d.tasks.map((t,i)=><div key={i} style={{ fontSize:"11px",color:"#333",marginBottom:"5px",lineHeight:1.4 }}>{"\u2014"} {t}</div>)}
                </div>
              ))}
            </div>
            <div style={{ background:"rgba(255,255,255,0.015)",border:"1px solid #0f0f0f",borderRadius:"4px",padding:"20px" }}>
              <div style={{ fontSize:"9px",color:"#10b981",letterSpacing:"4px",marginBottom:"16px" }}>SUNDAY: 6 REVIEW QUESTIONS (EVERY WEEK, NO EXCEPTIONS)</div>
              {[
                "What was my #1 highest-leverage action this week? Did I do enough of it?",
                "What did I avoid that I know I should have done? Why? How do I remove that blocker?",
                "What is the evidence that I am becoming who I said I'd become?",
                "If I repeat this exact week 52 times, do I hit my July 2026 targets? If not, what changes?",
                "Who did I add value to? Did I invest in any compounding relationships?",
                "What's the one thing that, if done consistently, makes everything else easier?",
              ].map((q,i)=>(
                <div key={i} style={{ display:"flex",gap:"12px",marginBottom:"13px",alignItems:"flex-start" }}>
                  <span style={{ color:"#10b981",fontSize:"10px",flexShrink:0,marginTop:"2px" }}>Q{i+1}</span>
                  <span style={{ fontSize:"12px",color:"#3a3a3a",lineHeight:1.7 }}>{q}</span>
                </div>
              ))}
            </div>
          </div>
        )}

        <div style={{ marginTop:"32px",display:"flex",justifyContent:"space-between",borderTop:"1px solid #0a0a0a",paddingTop:"12px" }}>
          <div style={{ fontSize:"9px",color:"#111",letterSpacing:"2px" }}>LIFEMAX OS v3.0</div>
          <div style={{ fontSize:"9px",color:"#111",letterSpacing:"2px" }}>{overallPct}% COMPLETE</div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<LifeMax />);
  </script>
</body>
</html>
