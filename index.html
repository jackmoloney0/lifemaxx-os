    function useCountdown() {
      const [t, setT] = useState({});
      useEffect(() => {
        const calc = () => {
          const diff = DEADLINE - new Date();
          if (diff <= 0) return setT({ days: 0, hours: 0, mins: 0, secs: 0 });
          setT({
            days: Math.floor(diff / 86400000),
            hours: Math.floor((diff % 86400000) / 3600000),
            mins: Math.floor((diff % 3600000) / 60000),
            secs: Math.floor((diff % 60000) / 1000),
          });
        };
        calc();
        const id = setInterval(calc, 1000);
        return () => clearInterval(id);
      }, []);
      return t;
    }

    function XPToast({ amount, color, onDone }) {
      useEffect(() => {
        const t = setTimeout(onDone, 1400);
        return () => clearTimeout(t);
      }, []);
      return (
        <div style={{
          position: "fixed", top: "38%", left: "50%",
          transform: "translateX(-50%)",
          zIndex: 9999, pointerEvents: "none",
          animation: "xpFloat 1.4s cubic-bezier(0.22,1,0.36,1) forwards",
          fontFamily: "'IBM Plex Mono', monospace",
          fontSize: "15px", fontWeight: "500",
          color: color,
          letterSpacing: "0.02em",
        }}>
          +{amount} XP
        </div>
      );
    }

    function AchievementToast({ a, onDone }) {

    function LifeMax() {

      const [activeGoal, setActiveGoal] = useState(null);
      const [activeTab, setActiveTab] = useState("goals");
      const [quote, setQuote] = useState(FALLBACK_QUOTES[new Date().getDay() % FALLBACK_QUOTES.length]);
      const [quoteLoading, setQuoteLoading] = useState(false);
      const [xpPopup, setXpPopup] = useState(null);
      const [streak, setStreak] = useState(0);
      const [readingBooks, setReadingBooks] = useState(
        READING_BOOKS.map(b => ({ ...b, pagesRead: 0 }))
      );
      const [achievements, setAchievements] = useState([]);
      const [newAchievement, setNewAchievement] = useState(null);
      const countdown = useCountdown();

      useEffect(() => {
        const today = new Date().toDateString();
        const cached = localStorage.getItem("lifemax_quote_" + today);
        if (cached) { try { setQuote(JSON.parse(cached)); } catch {} return; }
      }, []);

      const refreshQuote = () => {
        setQuote(FALLBACK_QUOTES[Math.floor(Math.random() * FALLBACK_QUOTES.length)]);
      };

      const totalXP = goals.reduce((acc, g) => {
        const ratio = g.milestones.filter(m => m.done).length / g.milestones.length;
        return acc + Math.floor(g.xp * ratio);
      }, 0);
      const maxXP = goals.reduce((acc, g) => acc + g.xp, 0);

      const levelXP = totalXP % 600;
      const overallPct = Math.round((totalXP / maxXP) * 100);

      const readingXP = readingBooks.reduce((acc, b) => {
        return acc + Math.floor(300 * Math.min(b.pagesRead / b.pages, 1));
      }, 0);

      const totalPages = readingBooks.reduce((a, b) => a + b.pages, 0);
      const readPages = readingBooks.reduce((a, b) => a + b.pagesRead, 0);
      const totalReadingPct = totalPages > 0 ? Math.round((readPages / totalPages) * 100) : 0;

      const ACHIEVEMENT_DEFS = [
        { id: "first_xp", label: "First Milestone", desc: "Complete your first milestone", check: (g) => g.some(x => x.milestones.some(m => m.done)) },
        { id: "level5", label: "Level 5", desc: "Reach Level 5", check: (g) => Math.floor(g.reduce((a, x) => a + Math.floor(x.xp * (x.milestones.filter(m => m.done).length / x.milestones.length)), 0) / 600) + 1 >= 5 },
        { id: "halfway", label: "Halfway", desc: "50% overall completion", check: (g) => { const t = g.reduce((a, x) => a + Math.floor(x.xp * (x.milestones.filter(m => m.done).length / x.milestones.length)), 0); return Math.round((t / g.reduce((a, x) => a + x.xp, 0)) * 100) >= 50; } },
      ];

      const toggleMilestone = (goalId, mIdx) => {
        setGoals(prev => {
          const next = prev.map(goal =>
            goal.id === goalId
              ? { ...goal, milestones: goal.milestones.map((m, i) => i === mIdx ? { ...m, done: !m.done } : m) }
              : goal
          );
          const wasJustCompleted = !prev.find(g => g.id === goalId).milestones[mIdx].done;
          if (wasJustCompleted) {
            const goal = next.find(g => g.id === goalId);
            const xpGained = Math.floor(goal.xp / goal.milestones.length);
            setXpPopup({ amount: xpGained, color: goal.color });
            setStreak(s => s + 1);
            ACHIEVEMENT_DEFS.forEach(a => {
              if (!achievements.includes(a.id) && a.check(next)) {
                setAchievements(prev => [...prev, a.id]);
                setNewAchievement(a);
              }
            });
          }
          return next;
        });
      };

      const updateBookPages = (idx, pages) => {
        setReadingBooks(prev => prev.map((b, i) => i === idx ? { ...b, pagesRead: Math.min(Math.max(0, pages), b.pages) } : b));

                {streak > 0 && <div style={{ marginTop: "8px", fontSize: "12px", color: "#444" }}>{streak} milestone{streak !== 1 ? "s" : ""} completed this session</div>}

                  {countdown.days}d {String(countdown.hours ?? 0).padStart(2, "0")}:{String(countdown.mins ?? 0).padStart(2, "0")}:{String(countdown.secs ?? 0).padStart(2, "0")}
                </div>
                <div style={{ fontSize: "10px", color: "#2a2a2a", marginTop: "4px" }}>July 1 · 2026</div>

                  </div>
                </div>
              ))}

            <nav style={{ display: "flex", marginBottom: "44px", borderBottom: "1px solid rgba(255,255,255,0.06)" }}>
              {tabs.map(tab => (

                  color: activeTab === tab.id ? "#e0e0e0" : "#3a3a3a",

                }}>{tab.label}</button>
              ))}
            </nav>

            {activeTab === "goals" && (
              <div style={{ animation: "fadeUp 0.22s ease" }}>
                <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(300px, 1fr))", gap: "10px" }}>
                  {goals.map(goal => {
                    const done = goal.milestones.filter(m => m.done).length;
                    const pct = Math.round((done / goal.milestones.length) * 100);
                    const earnedXP = Math.floor(goal.xp * (done / goal.milestones.length));
                    const isActive = activeGoal === goal.id;
                    return (
                      <div key={goal.id} onClick={() => setActiveGoal(isActive ? null : goal.id)} style={{ background: "#0d0d0d", border: `1px solid ${isActive ? "rgba(255,255,255,0.1)" : "rgba(255,255,255,0.05)"}`, borderRadius: "12px", padding: "22px", cursor: "pointer", gridColumn: isActive ? "1 / -1" : "auto", transition: "border-color 0.15s" }}>
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: "16px" }}>
                          <div>
                            <div style={{ fontSize: "14px", fontWeight: "500", color: "#f0f0f0", marginBottom: "4px" }}>{goal.title}</div>
                            <div style={{ fontSize: "12px", color: "#3a3a3a" }}>{goal.target}</div>
                          </div>
                          {earnedXP > 0 && <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: "11px", color: goal.color, flexShrink: 0, marginLeft: "14px" }}>+{earnedXP} XP</span>}
                        </div>
                        <div>
                          <div style={{ display: "flex", justifyContent: "space-between", marginBottom: "7px" }}>
                            <span style={{ fontSize: "11px", color: "#2a2a2a" }}>{done} / {goal.milestones.length}</span>
                            <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: "11px", color: pct > 0 ? goal.color : "#2a2a2a" }}>{pct}%</span>
                          </div>
                          <div style={{ height: "2px", background: "rgba(255,255,255,0.06)", borderRadius: "1px" }}>
                            <div style={{ height: "100%", width: `${pct}%`, background: goal.color, borderRadius: "1px", transition: "width 0.4s" }} />
                          </div>
                        </div>
                        {!isActive && <div style={{ fontSize: "11px", color: "#1e1e1e", marginTop: "14px" }}>Click to expand</div>}
                        {isActive && (
                          <div style={{ marginTop: "28px", paddingTop: "28px", borderTop: "1px solid rgba(255,255,255,0.05)" }}>
                            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(220px, 1fr))", gap: "10px", marginBottom: "28px" }}>
                              {[
                                { label: "Identity", content: `"${goal.identity}"`, accent: goal.color, italic: true },
                                { label: "Anti-goal", content: goal.antiGoal, accent: "#ef4444", italic: false },
                                { label: "Weekly inputs", list: goal.weeklyInputs, accent: "#10b981" },
                                { label: "Strategy", content: goal.strategy, accent: "#6366f1", italic: false },
                              ].map(({ label, content, accent, italic, list }, idx) => (
                                <div key={idx} style={{ background: "#111", borderRadius: "8px", padding: "16px" }}>
                                  <div style={{ fontSize: "10px", color: accent, textTransform: "uppercase", letterSpacing: "0.1em", fontWeight: "600", marginBottom: "8px" }}>{label}</div>
                                  {list
                                    ? list.map((item, j) => <div key={j} style={{ fontSize: "12px", color: "#3a3a3a", marginBottom: "5px", lineHeight: 1.5 }}>— {item}</div>)
                                    : <p style={{ fontSize: "12px", color: "#444", lineHeight: 1.65, fontStyle: italic ? "italic" : "normal" }}>{content}</p>
                                  }
                                </div>
                              ))}
                            </div>
                            <div style={{ fontSize: "10px", color: "#2a2a2a", textTransform: "uppercase", letterSpacing: "0.1em", fontWeight: "500", marginBottom: "12px" }}>Milestones</div>
                            {goal.milestones.map((m, i) => (
                              <div key={i} onClick={e => { e.stopPropagation(); toggleMilestone(goal.id, i); }} style={{ display: "flex", alignItems: "flex-start", gap: "14px", padding: "14px 16px", marginBottom: "6px", background: m.done ? `${goal.color}0e` : "#111", border: `1px solid ${m.done ? goal.color + "2a" : "rgba(255,255,255,0.05)"}`, borderRadius: "8px", cursor: "pointer", transition: "background 0.15s, border-color 0.15s" }}>
                                <div style={{ width: "16px", height: "16px", flexShrink: 0, border: `1.5px solid ${m.done ? goal.color : "rgba(255,255,255,0.12)"}`, borderRadius: "4px", background: m.done ? goal.color : "transparent", display: "flex", alignItems: "center", justifyContent: "center", marginTop: "2px", transition: "all 0.15s" }}>
                                  {m.done && <span style={{ fontSize: "8px", color: "#000", fontWeight: "800" }}>✓</span>}
                                </div>
                                <div style={{ flex: 1, minWidth: 0 }}>
                                  <div style={{ fontSize: "13px", color: m.done ? "#2e2e2e" : "#ccc", textDecoration: m.done ? "line-through" : "none", marginBottom: "5px", lineHeight: 1.55 }}>{m.label}</div>
                                  <div style={{ fontSize: "11px", color: m.done ? goal.color + "60" : "#222" }}>{m.metric}</div>
                                </div>
                                {m.done && <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: "11px", color: goal.color, flexShrink: 0, paddingTop: "2px" }}>+{Math.floor(goal.xp / goal.milestones.length)}</span>}
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {activeTab === "reading" && (
              <div style={{ animation: "fadeUp 0.22s ease" }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end", marginBottom: "28px" }}>
                  <div>
                    <div style={{ fontSize: "20px", fontWeight: "600", color: "#f0f0f0", letterSpacing: "-0.03em", marginBottom: "5px" }}>Reading Tracker</div>
                    <div style={{ fontSize: "12px", color: "#333" }}>{readPages.toLocaleString()} of {totalPages.toLocaleString()} pages · target 2 books/month</div>
                  </div>
                  <div style={{ textAlign: "right" }}>
                    <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: "26px", fontWeight: "600", color: "#f97316", lineHeight: 1 }}>{readingXP}</div>
                    <div style={{ fontSize: "10px", color: "#2a2a2a", marginTop: "4px", textTransform: "uppercase", letterSpacing: "0.08em" }}>Reading XP</div>
                  </div>
                </div>
                <div style={{ marginBottom: "36px" }}>
                  <div style={{ display: "flex", justifyContent: "space-between", marginBottom: "8px" }}>
                    <span style={{ fontSize: "10px", color: "#2a2a2a", textTransform: "uppercase", letterSpacing: "0.1em" }}>Overall progress</span>
                    <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: "11px", color: "#f97316" }}>{totalReadingPct}%</span>
                  </div>
                  <div style={{ height: "3px", background: "rgba(255,255,255,0.06)", borderRadius: "2px" }}>
                    <div style={{ height: "100%", width: `${totalReadingPct}%`, background: "linear-gradient(90deg, #f97316, #f59e0b)", borderRadius: "2px", transition: "width 0.5s ease" }} />
                  </div>
                </div>
                <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(290px, 1fr))", gap: "10px", marginBottom: "44px" }}>
                  {readingBooks.map((book, idx) => {
                    const pct = book.pages > 0 ? Math.round((book.pagesRead / book.pages) * 100) : 0;
                    const xpEarned = Math.floor(300 * Math.min(book.pagesRead / book.pages, 1));
                    return (
                      <div key={idx} style={{ background: "#0d0d0d", border: "1px solid rgba(255,255,255,0.05)", borderRadius: "12px", padding: "20px" }}>
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: "14px" }}>
                          <div>
                            <div style={{ fontSize: "13px", fontWeight: "500", color: "#e0e0e0", marginBottom: "3px" }}>{book.title}</div>
                            <div style={{ fontSize: "11px", color: "#333" }}>{book.author} · {book.pages}p</div>
                          </div>
                          <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: "12px", color: book.color, flexShrink: 0, marginLeft: "10px" }}>{pct}%</span>
                        </div>
                        <div style={{ marginBottom: "12px" }}>
                          <div style={{ height: "2px", background: "rgba(255,255,255,0.06)", borderRadius: "1px", marginBottom: "7px" }}>
                            <div style={{ height: "100%", width: `${pct}%`, background: book.color, borderRadius: "1px", transition: "width 0.3s" }} />
                          </div>
                          <div style={{ fontSize: "11px", color: "#2a2a2a" }}>{book.pagesRead} / {book.pages} pages · {xpEarned} XP</div>
                        </div>
                        <input type="range" min="0" max={book.pages} value={book.pagesRead}
                          onChange={e => { e.stopPropagation(); updateBookPages(idx, parseInt(e.target.value)); }}
                          style={{ accentColor: book.color, background: `linear-gradient(to right, ${book.color} ${pct}%, rgba(255,255,255,0.06) ${pct}%)`, marginBottom: "12px" }}
                        />
                        <div style={{ display: "flex", gap: "4px", marginBottom: "14px" }}>
                          {[0, 25, 50, 75, 100].map(p => (
                            <button key={p} onClick={e => { e.stopPropagation(); updateBookPages(idx, Math.floor(book.pages * (p / 100))); }} style={{ flex: 1, background: pct === p ? book.color : "rgba(255,255,255,0.04)", color: pct === p ? "#000" : "#333", border: `1px solid ${pct === p ? book.color : "rgba(255,255,255,0.06)"}`, borderRadius: "5px", padding: "5px 0", fontSize: "10px", fontWeight: pct === p ? "600" : "400" }}>{p}%</button>
                          ))}
                        </div>
                        <div style={{ padding: "11px 13px", background: "#111", borderRadius: "7px" }}>
                          <div style={{ fontSize: "10px", color: book.color, textTransform: "uppercase", letterSpacing: "0.08em", fontWeight: "600", marginBottom: "4px" }}>Implement</div>
                          <div style={{ fontSize: "11px", color: "#3a3a3a", lineHeight: 1.55 }}>{book.goal}</div>
                        </div>
                        {pct === 100 && <div style={{ marginTop: "10px", fontSize: "11px", color: "#10b981", fontWeight: "500" }}>Complete · +300 XP</div>}
                      </div>
                    );
                  })}
                </div>
                <div style={{ background: "#0d0d0d", border: "1px solid rgba(255,255,255,0.05)", borderRadius: "12px", padding: "26px" }}>
                  <div style={{ fontSize: "11px", color: "#333", textTransform: "uppercase", letterSpacing: "0.1em", fontWeight: "500", marginBottom: "20px" }}>Reading Discipline</div>
                  <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(160px, 1fr))", gap: "10px", marginBottom: "22px" }}>
                    {[{ label: "Daily minimum", value: "30 pages" }, { label: "Weekly target", value: "210 pages" }, { label: "Monthly books", value: "2 books" }, { label: "Annual target", value: "24 books" }].map((item, i) => (
                      <div key={i} style={{ padding: "14px", background: "#111", borderRadius: "8px" }}>
                        <div style={{ fontSize: "10px", color: "#2a2a2a", textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: "5px" }}>{item.label}</div>
                        <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: "15px", fontWeight: "500", color: "#f97316" }}>{item.value}</div>
                      </div>
                    ))}
                  </div>
                  {["Never finish a book without writing 1 action you'll take this week because of it.", "Read with a purpose — what problem are you trying to solve right now?", "Implementation gap is where all value is lost. Read less, implement more."].map((r, i) => (
                    <div key={i} style={{ fontSize: "12px", color: "#2a2a2a", marginBottom: "9px", lineHeight: 1.65, paddingLeft: "14px", borderLeft: "1px solid rgba(255,255,255,0.06)" }}>{r}</div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === "identity" && (
              <div style={{ animation: "fadeUp 0.22s ease" }}>
                <div style={{ marginBottom: "40px" }}>
                  <div style={{ fontSize: "11px", color: "#2a2a2a", textTransform: "uppercase", letterSpacing: "0.12em", fontWeight: "500", marginBottom: "10px" }}>Who you are becoming</div>
                  <p style={{ fontSize: "13px", color: "#2e2e2e", lineHeight: 1.75, maxWidth: "520px" }}>Identity change is the meta-skill. When you change who you are, behaviour change becomes automatic. Read these every morning.</p>
                </div>
                <div style={{ display: "flex", flexDirection: "column", gap: "8px", marginBottom: "44px" }}>
                  {IDENTITY.map((s, i) => (
                    <div key={i} style={{ display: "flex", alignItems: "flex-start", gap: "18px", padding: "18px 20px", background: "#0d0d0d", border: "1px solid rgba(255,255,255,0.05)", borderRadius: "10px" }}>
                      <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: "11px", color: "#1e1e1e", paddingTop: "3px", flexShrink: 0 }}>{String(i + 1).padStart(2, "0")}</span>
                      <span style={{ fontSize: "15px", color: "#bbb", fontStyle: "italic", lineHeight: 1.6, letterSpacing: "-0.01em" }}>"{s}"</span>
                    </div>
                  ))}
                </div>
                <div style={{ background: "#0d0d0d", border: "1px solid rgba(255,255,255,0.05)", borderRadius: "12px", padding: "28px" }}>
                  <div style={{ fontSize: "11px", color: "#6366f1", textTransform: "uppercase", letterSpacing: "0.1em", fontWeight: "600", marginBottom: "26px" }}>George Mack · 5 Operating Principles</div>
                  {[
                    { model: "Asymmetric Bets", desc: "Every project has a capped downside (10 days) and uncapped upside (life-changing). Stack them relentlessly." },
                    { model: "Expected Value Thinking", desc: "P(success) × value if success. Cold emailing a founder: 5% chance, life-changing outcome. The math says always do it." },
                    { model: "Hard Fork Moments", desc: "You're at one right now. The decisions you make at 19 set the entire trajectory. Most people underestimate how much this moment matters." },
                    { model: "Surface Area for Luck", desc: "Luck = preparation × exposure. Every public artefact is a lottery ticket that never expires. Ship publicly, always." },
                    { model: "Skin In The Game", desc: "Announce goals publicly. The embarrassment of failing publicly is a stronger motivator than any productivity system ever built." },
                  ].map((m, i) => (
                    <div key={i} style={{ paddingLeft: "18px", borderLeft: `1px solid rgba(99,102,241,${i === 0 ? "0.5" : "0.2"})`, marginBottom: i < 4 ? "22px" : 0 }}>
                      <div style={{ fontSize: "13px", fontWeight: "500", color: "#8183f4", marginBottom: "5px" }}>{m.model}</div>
                      <div style={{ fontSize: "12px", color: "#3a3a3a", lineHeight: 1.7 }}>{m.desc}</div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === "weekly" && (
              <div style={{ animation: "fadeUp 0.22s ease" }}>
                <div style={{ fontSize: "11px", color: "#2a2a2a", textTransform: "uppercase", letterSpacing: "0.12em", fontWeight: "500", marginBottom: "28px" }}>Weekly Operating System</div>
                <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(186px, 1fr))", gap: "10px", marginBottom: "36px" }}>
                  {[
                    { day: "Mon", color: "#f59e0b", tasks: ["Deep work: Build (2hr min)", "5 cold outreach messages", "Portfolio project sprint"] },
                    { day: "Tue", color: "#ef4444", tasks: ["Film YouTube content", "Customer discovery call", "Read 30 pages + 1 insight"] },
                    { day: "Wed", color: "#8b5cf6", tasks: ["AI tool experimentation", "Major project progress", "LinkedIn/GitHub update"] },
                    { day: "Thu", color: "#3b82f6", tasks: ["Business: validate or build", "Cold email batch + follow-ups", "Deep work: Create (2hr min)"] },
                    { day: "Fri", color: "#10b981", tasks: ["Ship something publicly", "Weekly metrics review", "Plan next week's targets"] },
                    { day: "Sat", color: "#f97316", tasks: ["Long deep build session (3hr)", "Read long-form / books", "What moved the needle?"] },
                    { day: "Sun", color: "#555", tasks: ["Rest intentionally", "6 review questions below", "Set Monday's #1 priority"] },
                  ].map(d => (
                    <div key={d.day} style={{ background: "#0d0d0d", border: "1px solid rgba(255,255,255,0.05)", borderRadius: "10px", padding: "18px 16px" }}>
                      <div style={{ fontSize: "13px", fontWeight: "600", color: d.color, marginBottom: "14px" }}>{d.day}</div>
                      {d.tasks.map((t, i) => <div key={i} style={{ fontSize: "12px", color: "#333", marginBottom: "7px", lineHeight: 1.45 }}>{t}</div>)}
                    </div>
                  ))}
                </div>
                <div style={{ background: "#0d0d0d", border: "1px solid rgba(255,255,255,0.05)", borderRadius: "12px", padding: "28px" }}>
                  <div style={{ fontSize: "11px", color: "#10b981", textTransform: "uppercase", letterSpacing: "0.1em", fontWeight: "600", marginBottom: "24px" }}>Sunday Review · 6 Questions — no exceptions</div>
                  {[
                    "What was my #1 highest-leverage action this week? Did I do enough of it?",
                    "What did I avoid that I know I should have done? Why? How do I remove that blocker?",
                    "What is the evidence that I am becoming who I said I'd become?",
                    "If I repeat this exact week 52 times, do I hit my July 2026 targets? If not, what changes?",
                    "Who did I add value to? Did I invest in any compounding relationships?",
                    "What's the one thing that, if done consistently, makes everything else easier?",
                  ].map((q, i) => (
                    <div key={i} style={{ display: "flex", gap: "18px", marginBottom: i < 5 ? "16px" : 0, alignItems: "flex-start" }}>
                      <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: "11px", color: "#10b981", flexShrink: 0, paddingTop: "3px" }}>Q{i + 1}</span>
                      <span style={{ fontSize: "13px", color: "#3a3a3a", lineHeight: 1.7 }}>{q}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            <footer style={{ marginTop: "64px", paddingTop: "18px", borderTop: "1px solid rgba(255,255,255,0.04)", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <div style={{ fontSize: "11px", color: "#1e1e1e" }}>Life OS · {overallPct}% complete</div>
              <div style={{ display: "flex", gap: "20px", alignItems: "center" }}>
                {achievements.length > 0 && (
                  <div style={{ display: "flex", gap: "8px" }}>
                    {ACHIEVEMENT_DEFS.filter(a => achievements.includes(a.id)).map(a => (
                      <span key={a.id} style={{ fontSize: "10px", color: "#6366f1", background: "rgba(99,102,241,0.1)", padding: "3px 10px", borderRadius: "20px", fontWeight: "500" }}>{a.label}</span>
                    ))}
                  </div>
                )}
                <div style={{ fontSize: "11px", color: "#1e1e1e" }}>Built with Claude Code</div>
              </div>
            </footer>

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<LifeMax />);
  </script>
</body>
</html>
