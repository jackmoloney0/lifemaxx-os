    function useCountdown() {
      const [t, setT] = useState({});
      useEffect(() => {
        const calc = () => {
          const diff = DEADLINE - new Date();
          if (diff <= 0) return setT({ days: 0, hours: 0, mins: 0, secs: 0 });
          setT({
            days: Math.floor(diff / 86400000),
            hours: Math.floor((diff % 86400000) / 3600000),
            mins: Math.floor((diff % 3600000) / 60000),
            secs: Math.floor((diff % 60000) / 1000),
          });
        };
        calc();
        const id = setInterval(calc, 1000);
        return () => clearInterval(id);
      }, []);
      return t;
    }

      const [quoteLoading, setQuoteLoading] = useState(false);
      const [xpPopup, setXpPopup] = useState(null);
      const [streak, setStreak] = useState(0);
      const [readingBooks, setReadingBooks] = useState(() => {
        const saved = loadLS("lmos_reading", null);
        return READING_BOOKS.map((b, i) => ({ ...b, pagesRead: saved?.[i] ?? 0 }));
      });
      const [achievements, setAchievements] = useState(() => loadLS("lmos_achievements", []));
      const [newAchievement, setNewAchievement] = useState(null);
      const [savedFlash, setSavedFlash] = useState(false);
      const [wisdomFilter, setWisdomFilter] = useState(null);
      const [todayTasks, setTodayTasks] = useState(() => loadLS("lmos_htasks", []));
      const [nnChecked, setNnChecked] = useState(() => loadLS("lmos_nn", {}));
      const [dailyLogs, setDailyLogs] = useState(() => loadLS("lmos_dlogs", []));
      const [outputs, setOutputs] = useState(() => loadLS("lmos_outputs", {}));
      const [ideas, setIdeas] = useState(() => loadLS("lmos_ideas", []));
      const [focusTask, setFocusTask] = useState(null);
      const [focusNotes, setFocusNotes] = useState("");
      const [focusElapsed, setFocusElapsed] = useState(0);
      const [newTaskText, setNewTaskText] = useState("");
      const [newTaskGoal, setNewTaskGoal] = useState("business");
      const [newTaskImpact, setNewTaskImpact] = useState(7);
      const [newTaskTime, setNewTaskTime] = useState("1hr");
      const [newIdeaText, setNewIdeaText] = useState("");
      const [newIdeaGoal, setNewIdeaGoal] = useState("business");
      const [logScore, setLogScore] = useState(7);
      const [logShipped, setLogShipped] = useState("");
      const [logMattered, setLogMattered] = useState("");
      const [outputGoal, setOutputGoal] = useState(null);
      const [outputText, setOutputText] = useState("");
      const [showAddTask, setShowAddTask] = useState(false);
      // Goal-specific execution state
      const [internPipeline, setInternPipeline] = useState(() => loadLS("lmos_intern", []));
      const [bizTracker, setBizTracker] = useState(() => loadLS("lmos_biz", { mrr: 0, experiments: [], convos: 0, offers: 0 }));
      const [ytTracker, setYtTracker] = useState(() => loadLS("lmos_yt", { videos: [], ideas: [], subs: 0 }));
      const [readInsights, setReadInsights] = useState(() => loadLS("lmos_rins", {}));
      const [identEvidence, setIdentEvidence] = useState(() => loadLS("lmos_iev", []));
      const [weeklyTargets, setWeeklyTargets] = useState(() => loadLS("lmos_wt", {}));
      const [weeklyReview, setWeeklyReview] = useState(() => loadLS("lmos_wr", {}));
      const [newCompanyName, setNewCompanyName] = useState("");
      const [newCompanyStatus, setNewCompanyStatus] = useState("applied");
      const [bizExpInput, setBizExpInput] = useState("");
      const [ytVideoInput, setYtVideoInput] = useState("");
      const [ytIdeaInput, setYtIdeaInput] = useState("");
      const [insightInputs, setInsightInputs] = useState({});
      const [evidenceStmtIdx, setEvidenceStmtIdx] = useState(null);
      const [evidenceInput, setEvidenceInput] = useState("");
      const [completedBookExpanded, setCompletedBookExpanded] = useState(null);
      const [historyWeekOpen, setHistoryWeekOpen] = useState(null);
      const countdown = useCountdown();

      // Persist goals milestones
      useEffect(() => {
        const data = {};
        goals.forEach(g => { data[g.id] = g.milestones.map(m => m.done); });
        saveLS("lmos_milestones", data);
      }, [goals]);

      // Persist reading progress
      const isFirstReadingRender = useRef(true);
      useEffect(() => {
        if (isFirstReadingRender.current) { isFirstReadingRender.current = false; return; }
        saveLS("lmos_reading", readingBooks.map(b => b.pagesRead));
        setSavedFlash(true);
        setTimeout(() => setSavedFlash(false), 1200);
      }, [readingBooks]);

      // Persist achievements
      useEffect(() => {
        saveLS("lmos_achievements", achievements);
      }, [achievements]);

      useEffect(() => {
        const today = new Date().toDateString();
        const cached = localStorage.getItem("lifemax_quote_" + today);
        if (cached) { try { setQuote(JSON.parse(cached)); } catch {} return; }
      }, []);

      const refreshQuote = () => {
        setQuote(FALLBACK_QUOTES[Math.floor(Math.random() * FALLBACK_QUOTES.length)]);
      };

      const totalXP = goals.reduce((acc, g) => {
        const ratio = g.milestones.filter(m => m.done).length / g.milestones.length;
        return acc + Math.floor(g.xp * ratio);
      }, 0);
      const maxXP = goals.reduce((acc, g) => acc + g.xp, 0);
      const level = Math.floor(totalXP / 600) + 1;
      const levelXP = totalXP % 600;
      const overallPct = Math.round((totalXP / maxXP) * 100);

      const readingXP = readingBooks.reduce((acc, b) => {
        return acc + Math.floor(300 * Math.min(b.pagesRead / b.pages, 1));
      }, 0);

      const totalPages = readingBooks.reduce((a, b) => a + b.pages, 0);
      const readPages = readingBooks.reduce((a, b) => a + b.pagesRead, 0);
      const totalReadingPct = totalPages > 0 ? Math.round((readPages / totalPages) * 100) : 0;

      const ACHIEVEMENT_DEFS = [
        { id: "first_xp", label: "First Milestone", desc: "Complete your first milestone", check: (g) => g.some(x => x.milestones.some(m => m.done)) },
        { id: "level5", label: "Level 5", desc: "Reach Level 5", check: (g) => Math.floor(g.reduce((a, x) => a + Math.floor(x.xp * (x.milestones.filter(m => m.done).length / x.milestones.length)), 0) / 600) + 1 >= 5 },
        { id: "halfway", label: "Halfway", desc: "50% overall completion", check: (g) => { const t = g.reduce((a, x) => a + Math.floor(x.xp * (x.milestones.filter(m => m.done).length / x.milestones.length)), 0); return Math.round((t / g.reduce((a, x) => a + x.xp, 0)) * 100) >= 50; } },
      ];

      const toggleMilestone = (goalId, mIdx) => {
        setGoals(prev => {
          const next = prev.map(goal =>
            goal.id === goalId
              ? { ...goal, milestones: goal.milestones.map((m, i) => i === mIdx ? { ...m, done: !m.done } : m) }
              : goal
          );
          const wasJustCompleted = !prev.find(g => g.id === goalId).milestones[mIdx].done;
          if (wasJustCompleted) {
            const goal = next.find(g => g.id === goalId);
            const xpGained = Math.floor(goal.xp / goal.milestones.length);
            setXpPopup({ amount: xpGained, color: goal.color });
            setStreak(s => s + 1);
            ACHIEVEMENT_DEFS.forEach(a => {
              if (!achievements.includes(a.id) && a.check(next)) {
                setAchievements(prev => [...prev, a.id]);
                setNewAchievement(a);
              }
            });
          }
          return next;
        });
      };

      const updateBookPages = (idx, pages) => {
        setReadingBooks(prev => prev.map((b, i) => i === idx ? { ...b, pagesRead: Math.min(Math.max(0, pages), b.pages) } : b));
      };

      // Persist execution engine
      useEffect(() => { saveLS("lmos_htasks", todayTasks); }, [todayTasks]);
      useEffect(() => { saveLS("lmos_nn", nnChecked); }, [nnChecked]);
      useEffect(() => { saveLS("lmos_dlogs", dailyLogs); }, [dailyLogs]);
      useEffect(() => { saveLS("lmos_outputs", outputs); }, [outputs]);
      useEffect(() => { saveLS("lmos_ideas", ideas); }, [ideas]);
      useEffect(() => { saveLS("lmos_intern", internPipeline); }, [internPipeline]);
      useEffect(() => { saveLS("lmos_biz", bizTracker); }, [bizTracker]);
      useEffect(() => { saveLS("lmos_yt", ytTracker); }, [ytTracker]);
      useEffect(() => { saveLS("lmos_rins", readInsights); }, [readInsights]);
      useEffect(() => { saveLS("lmos_iev", identEvidence); }, [identEvidence]);
      useEffect(() => { saveLS("lmos_wt", weeklyTargets); }, [weeklyTargets]);
      useEffect(() => { saveLS("lmos_wr", weeklyReview); }, [weeklyReview]);
      useEffect(() => {
        if (!focusTask) return;
        const t = setInterval(() => setFocusElapsed(e => e + 1), 1000);
        return () => clearInterval(t);
      }, [focusTask]);

      // Execution computed values
      const todayKey = new Date().toDateString();
      const todayDoneTasks = todayTasks.filter(t => t.date === todayKey && t.done).length;
      const nnDoneToday = NON_NEGOTIABLES.filter(n => nnChecked[`${todayKey}_${n.id}`]).length;
      const todayLog = dailyLogs.find(l => l.date === todayKey);
      const momentumScore = Math.min(100, Math.round(
        Math.min(streak * 3, 25) + Math.min(todayDoneTasks * 7, 35) + Math.min(nnDoneToday * 6.25, 25) + (todayLog ? 15 : 0)
      ));
      const momentumColor = momentumScore >= 67 ? "#10b981" : momentumScore >= 34 ? "#f59e0b" : "#ef4444";
      const momentumLabel = momentumScore >= 67 ? "Building ↑" : momentumScore >= 34 ? "Steady →" : "Decaying ↓";
      const msTotal = new Date("2026-07-01") - new Date("2026-01-01");
      const msElapsed = new Date() - new Date("2026-01-01");
      const timePct = Math.min(100, Math.round((msElapsed / msTotal) * 100));
      const onTrack = overallPct >= timePct;

      const getDaysSinceOutput = (goalId) => {
        const outs = outputs[goalId];
        if (!outs || outs.length === 0) return null;
        return Math.floor((new Date() - new Date(outs[outs.length - 1].date)) / 86400000);
      };
      const inactivityAlerts = goals.map(g => {
        const days = getDaysSinceOutput(g.id);
        if (days === null) return { goalId: g.id, title: g.title, color: g.color, msg: "No output logged yet" };
        if (days >= 3) return { goalId: g.id, title: g.title, color: g.color, msg: `No output in ${days}d` };
        return null;
      }).filter(Boolean);

      // Goal-specific computed values
      const getWeekKey = () => {
        const d = new Date();
        const startOfYear = new Date(d.getFullYear(), 0, 1);
        const weekNum = Math.ceil(((d - startOfYear) / 86400000 + startOfYear.getDay() + 1) / 7);
        return `${d.getFullYear()}-W${String(weekNum).padStart(2, '0')}`;
      };
      const weekKey = getWeekKey();
      const internStats = {
        applied: internPipeline.filter(c => c.status === 'applied').length,
        outreached: internPipeline.filter(c => c.status === 'outreached').length,
        interviews: internPipeline.filter(c => c.status === 'interview').length,
        offers: internPipeline.filter(c => c.status === 'offer').length,
      };
      const ytLastUpload = ytTracker.videos.length > 0 ? Math.floor((new Date() - new Date(ytTracker.videos[ytTracker.videos.length - 1].date)) / 86400000) : null;

      const formatElapsed = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
      const startFocus = (task) => { setFocusTask(task); setFocusElapsed(0); setFocusNotes(""); };
      const endFocus = () => {
        if (focusTask) setTodayTasks(prev => prev.map(t => t.id === focusTask.id ? { ...t, done: true, focusTime: (t.focusTime || 0) + focusElapsed } : t));
        setFocusTask(null); setFocusNotes(""); setFocusElapsed(0);
      };
      const addTodayTask = () => {
        if (!newTaskText.trim()) return;
        setTodayTasks(prev => [...prev, { id: Date.now(), text: newTaskText.trim(), goalId: newTaskGoal, impact: newTaskImpact, timeEst: newTaskTime, done: false, date: todayKey, focusTime: 0 }]);
        setNewTaskText(""); setShowAddTask(false);
      };
      const logOutput = () => {
        if (!outputText.trim() || !outputGoal) return;
        setOutputs(prev => ({ ...prev, [outputGoal]: [...(prev[outputGoal] || []), { date: new Date().toISOString(), text: outputText.trim() }] }));
        setOutputGoal(null); setOutputText("");
      };
      const addIdea = () => {
        if (!newIdeaText.trim()) return;
        setIdeas(prev => [...prev, { id: Date.now(), text: newIdeaText.trim(), goalId: newIdeaGoal, status: 'active', createdAt: new Date().toISOString() }]);
        setNewIdeaText("");
      };
      const submitDailyLog = () => {
        if (!logShipped.trim() && !logMattered.trim()) return;
        setDailyLogs(prev => [...prev.filter(l => l.date !== todayKey), { date: todayKey, score: logScore, shipped: logShipped, mattered: logMattered }]);
        setLogShipped(""); setLogMattered("");
      };

      const tabs = [
        { id: "today", label: "Today" },
        { id: "goals", label: "Goals" },
        { id: "reading", label: `Reading${totalReadingPct > 0 ? ` · ${totalReadingPct}%` : ""}` },
        { id: "identity", label: "Identity" },
        { id: "weekly", label: "Weekly OS" },
        { id: "wisdom", label: "Wisdom" },
      ];

      const today = new Date();
      const dateLabel = today.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric" });

      return (
        <div style={{ minHeight: "100vh", background: "#080808", color: "#e0e0e0", fontFamily: "'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif", WebkitFontSmoothing: "antialiased" }}>
          <style>{`
            @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
            *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
            ::selection { background: rgba(99,102,241,0.25); }
            button { font-family: inherit; cursor: pointer; transition: opacity 0.15s; }
            button:hover { opacity: 0.7; }
            input, textarea { font-family: inherit; }
            input[type=range] { -webkit-appearance: none; appearance: none; height: 2px; border-radius: 1px; outline: none; cursor: pointer; display: block; width: 100%; }
            input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 11px; height: 11px; border-radius: 50%; cursor: pointer; }
            @keyframes xpFloat { 0% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); } 60% { opacity: 1; transform: translateX(-50%) translateY(-30px) scale(1.05); } 100% { opacity: 0; transform: translateX(-50%) translateY(-70px) scale(0.9); } }
            @keyframes toastIn { from { transform: translateX(16px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
            @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
            @keyframes shimmer { 0% { opacity: 0.3; } 50% { opacity: 0.6; } 100% { opacity: 0.3; } }
          `}</style>

          {xpPopup && <XPToast amount={xpPopup.amount} color={xpPopup.color} onDone={() => setXpPopup(null)} />}
          {newAchievement && <AchievementToast a={newAchievement} onDone={() => setNewAchievement(null)} />}

          {/* FOCUS MODE MODAL */}
          {focusTask && (
            <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.92)", zIndex: 1000, display: "flex", alignItems: "center", justifyContent: "center", padding: "24px" }}>
              <div style={{ width: "100%", maxWidth: "520px", background: "#0d0d0d", border: "1px solid rgba(255,255,255,0.08)", borderRadius: "16px", padding: "40px" }}>
                <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: "10px", letterSpacing: "0.15em", textTransform: "uppercase", color: "#333", marginBottom: "24px" }}>Focus Mode</div>
                <div style={{ fontSize: "22px", fontWeight: "600", color: "#f0f0f0", lineHeight: 1.3, marginBottom: "8px", letterSpacing: "-0.03em" }}>{focusTask.text}</div>
                <div style={{ display: "flex", gap: "10px", alignItems: "center", marginBottom: "36px" }}>
                  {focusTask.goalId && <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: "10px", color: (goals.find(g => g.id === focusTask.goalId) || {}).color || "#555", background: `${(goals.find(g => g.id === focusTask.goalId) || {}).color || "#555"}18`, padding: "3px 10px", borderRadius: "20px" }}>{focusTask.goalId}</span>}
                  {focusTask.timeEst && <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: "10px", color: "#333" }}>~{focusTask.timeEst}</span>}
                </div>
                <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: "52px", fontWeight: "600", color: "#6366f1", textAlign: "center", marginBottom: "36px", letterSpacing: "0.02em", lineHeight: 1 }}>{formatElapsed(focusElapsed)}</div>
                <textarea
                  value={focusNotes} onChange={e => setFocusNotes(e.target.value)}
                  placeholder="Notes, blockers, output..."
                  style={{ width: "100%", background: "#111", border: "1px solid rgba(255,255,255,0.07)", borderRadius: "8px", padding: "14px 16px", color: "#ccc", fontSize: "13px", resize: "vertical", minHeight: "80px", outline: "none", fontFamily: "inherit", lineHeight: 1.6, marginBottom: "24px" }}
                />
                <div style={{ display: "flex", gap: "10px" }}>
                  <button onClick={endFocus} style={{ flex: 1, background: "#10b981", border: "none", borderRadius: "8px", color: "#000", fontSize: "13px", fontWeight: "600", padding: "13px", cursor: "pointer", letterSpacing: "0.02em" }}>End Session · Mark Done</button>
                  <button onClick={() => { setFocusTask(null); setFocusNotes(""); setFocusElapsed(0); }} style={{ background: "none", border: "1px solid rgba(255,255,255,0.08)", borderRadius: "8px", color: "#444", fontSize: "13px", padding: "13px 20px", cursor: "pointer" }}>Exit</button>
                </div>
              </div>
            </div>
          )}

          {/* OUTPUT LOG MODAL */}
          {outputGoal && (
            <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.85)", zIndex: 999, display: "flex", alignItems: "center", justifyContent: "center", padding: "24px" }} onClick={() => { setOutputGoal(null); setOutputText(""); }}>
              <div style={{ width: "100%", maxWidth: "440px", background: "#0d0d0d", border: "1px solid rgba(255,255,255,0.08)", borderRadius: "14px", padding: "32px" }} onClick={e => e.stopPropagation()}>
                <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: "10px", letterSpacing: "0.12em", textTransform: "uppercase", color: (goals.find(g => g.id === outputGoal) || {}).color || "#6366f1", marginBottom: "16px" }}>Log Output · {outputGoal}</div>
                <textarea
                  value={outputText} onChange={e => setOutputText(e.target.value)} autoFocus
                  placeholder="What did you actually ship, do, or produce?"
                  style={{ width: "100%", background: "#111", border: "1px solid rgba(255,255,255,0.07)", borderRadius: "8px", padding: "12px 14px", color: "#ccc", fontSize: "13px", resize: "vertical", minHeight: "90px", outline: "none", fontFamily: "inherit", lineHeight: 1.6, marginBottom: "16px" }}
                  onKeyDown={e => { if (e.key === "Enter" && e.metaKey) logOutput(); }}
                />
                <div style={{ display: "flex", gap: "8px" }}>
                  <button onClick={logOutput} style={{ flex: 1, background: "#6366f1", border: "none", borderRadius: "7px", color: "#fff", fontSize: "12px", fontWeight: "600", padding: "11px", cursor: "pointer" }}>Log Output</button>
                  <button onClick={() => { setOutputGoal(null); setOutputText(""); }} style={{ background: "none", border: "1px solid rgba(255,255,255,0.07)", borderRadius: "7px", color: "#444", fontSize: "12px", padding: "11px 16px", cursor: "pointer" }}>Cancel</button>
                </div>
              </div>
            </div>
          )}

          <div style={{ maxWidth: "980px", margin: "0 auto", padding: "52px 28px 100px" }}>

            <header style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: "60px" }}>
              <div>
                <div style={{ fontSize: "11px", color: "#333", letterSpacing: "0.12em", textTransform: "uppercase", fontWeight: "500", marginBottom: "8px" }}>Jack Moloney · Life OS</div>
                <div style={{ fontSize: "26px", fontWeight: "600", color: "#f0f0f0", letterSpacing: "-0.04em", lineHeight: 1 }}>{dateLabel}</div>
                {streak > 0 && <div style={{ marginTop: "8px", fontSize: "12px", color: "#444" }}>{streak} milestone{streak !== 1 ? "s" : ""} completed this session</div>}
              </div>
              <div style={{ textAlign: "right", flexShrink: 0 }}>
                <div style={{ fontSize: "10px", color: "#2a2a2a", letterSpacing: "0.1em", textTransform: "uppercase", marginBottom: "6px" }}>Deadline</div>
                <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: "16px", color: "#6366f1", fontWeight: "500" }}>
                  {countdown.days}d {String(countdown.hours ?? 0).padStart(2, "0")}:{String(countdown.mins ?? 0).padStart(2, "0")}:{String(countdown.secs ?? 0).padStart(2, "0")}
                </div>
                <div style={{ fontSize: "10px", color: "#2a2a2a", marginTop: "4px" }}>July 1 · 2026</div>
              </div>
            </header>

            <div style={{ marginBottom: "60px", maxWidth: "700px" }}>
              <p style={{ fontSize: "19px", fontWeight: "300", color: "#aaa", lineHeight: 1.65, letterSpacing: "-0.01em", marginBottom: "14px" }}>"{quote.text}"</p>
              <div style={{ display: "flex", alignItems: "center", gap: "18px" }}>
                <span style={{ fontSize: "12px", color: "#3a3a3a", fontWeight: "500" }}>— {quote.author}</span>
                <button onClick={refreshQuote} style={{ fontSize: "11px", color: "#2a2a2a", background: "none", border: "none", padding: 0, textTransform: "uppercase", letterSpacing: "0.08em" }}>refresh</button>
              </div>
            </div>

            <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", background: "rgba(255,255,255,0.04)", borderRadius: "12px", overflow: "hidden", gap: "1px", marginBottom: "60px" }}>
              {[
                { label: "Level", value: level, sub: `${levelXP} / 600 XP`, barPct: (levelXP / 600) * 100, barColor: "#6366f1" },
                { label: "Total XP", value: (totalXP + readingXP).toLocaleString(), sub: `of ${(maxXP + 1800).toLocaleString()}`, barPct: ((totalXP + readingXP) / (maxXP + 1800)) * 100, barColor: "#8b5cf6" },
                { label: "Complete", value: `${overallPct}%`, sub: `${goals.reduce((a, g) => a + g.milestones.filter(m => m.done).length, 0)} milestones done`, barPct: overallPct, barColor: "#10b981" },
                { label: "Days left", value: countdown.days ?? "—", sub: `${String(countdown.hours ?? 0).padStart(2, "0")}h ${String(countdown.mins ?? 0).padStart(2, "0")}m`, barPct: Math.max(0, 100 - ((countdown.days ?? 0) / 480) * 100), barColor: "#f59e0b" },
              ].map(({ label, value, sub, barPct, barColor }, i) => (
                <div key={i} style={{ background: "#0d0d0d", padding: "22px 20px 18px" }}>
                  <div style={{ fontSize: "10px", color: "#333", letterSpacing: "0.1em", textTransform: "uppercase", fontWeight: "500", marginBottom: "10px" }}>{label}</div>
                  <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: "30px", fontWeight: "600", color: "#f0f0f0", lineHeight: 1, marginBottom: "6px" }}>{value}</div>
                  <div style={{ fontSize: "11px", color: "#2a2a2a", marginBottom: "12px" }}>{sub}</div>
                  <div style={{ height: "2px", background: "rgba(255,255,255,0.06)", borderRadius: "1px" }}>
                    <div style={{ height: "100%", width: `${Math.min(barPct, 100)}%`, background: barColor, borderRadius: "1px", transition: "width 0.6s ease" }} />
                  </div>
                </div>
              ))}
            </div>

            <nav style={{ display: "flex", marginBottom: "44px", borderBottom: "1px solid rgba(255,255,255,0.06)" }}>
              {tabs.map(tab => (
                <button key={tab.id} onClick={() => setActiveTab(tab.id)} style={{
                  background: "none", border: "none",
                  borderBottom: `2px solid ${activeTab === tab.id ? "#6366f1" : "transparent"}`,

                      </div>
                    </div>

                    <input value={evidenceInput} onChange={e => setEvidenceInput(e.target.value)} onKeyDown={e => { if (e.key === "Enter" && evidenceInput.trim() && evidenceStmtIdx !== null) { setIdentEvidence(p => [...p, { id: Date.now(), text: evidenceInput.trim(), stmtIdx: evidenceStmtIdx, date: new Date().toISOString() }]); setEvidenceInput(""); }}} placeholder="Evidence of who you're becoming..." style={{ flex: 1, background: "#111", border: "1px solid rgba(255,255,255,0.07)", borderRadius: "6px", padding: "8px 12px", color: "#ccc", fontSize: "12px", outline: "none", fontFamily: "inherit" }} />
                    <button onClick={() => { if (evidenceInput.trim() && evidenceStmtIdx !== null) { setIdentEvidence(p => [...p, { id: Date.now(), text: evidenceInput.trim(), stmtIdx: evidenceStmtIdx, date: new Date().toISOString() }]); setEvidenceInput(""); }}} style={{ background: "rgba(99,102,241,0.15)", border: "1px solid rgba(99,102,241,0.3)", borderRadius: "6px", color: "#6366f1", fontSize: "11px", padding: "8px 18px", cursor: "pointer", fontWeight: "600" }}>Log</button>
                  </div>
                  <div style={{ display: "flex", flexDirection: "column", gap: "8px", maxHeight: "300px", overflowY: "auto" }}>
                    {identEvidence.slice().reverse().map((ev) => (
                      <div key={ev.id} style={{ padding: "12px 14px", background: "#111", border: "1px solid rgba(99,102,241,0.08)", borderLeft: "2px solid rgba(99,102,241,0.35)", borderRadius: "7px" }}>
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: "6px" }}>
                          <span style={{ fontSize: "10px", color: "#6366f1", opacity: 0.65, fontStyle: "italic", flex: 1, lineHeight: 1.4 }}>{IDENTITY[ev.stmtIdx]}</span>
                          <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: "9px", color: "#1a1a1a", flexShrink: 0, marginLeft: "10px" }}>{new Date(ev.date).toLocaleDateString("en-GB", { day: "numeric", month: "short" })}</span>
                        </div>
                        <div style={{ fontSize: "13px", color: "#bbb", lineHeight: 1.55 }}>{ev.text}</div>
                      </div>
                    ))}
                    {identEvidence.length === 0 && <div style={{ fontSize: "12px", color: "#1a1a1a", fontStyle: "italic" }}>No evidence logged yet. Start proving who you are.</div>}
                  </div>
                </div>
              </div>
            )}

            {activeTab === "weekly" && (
              <div style={{ animation: "fadeUp 0.22s ease" }}>
                <div style={{ fontSize: "11px", color: "#2a2a2a", textTransform: "uppercase", letterSpacing: "0.12em", fontWeight: "500", marginBottom: "20px" }}>Weekly Operating System</div>
                <div style={{ background: "#0d0d0d", border: "1px solid rgba(255,255,255,0.05)", borderRadius: "12px", padding: "22px", marginBottom: "28px" }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "16px" }}>
                    <div style={{ fontSize: "10px", color: "#2a2a2a", textTransform: "uppercase", letterSpacing: "0.12em", fontWeight: "500" }}>This Week's Targets</div>
                    <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: "10px", color: "#1a1a1a" }}>{weekKey}</span>
                  </div>
                  <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(260px, 1fr))", gap: "8px", marginBottom: "20px" }}>
                    {goals.map(g => (
                      <div key={g.id} style={{ background: "#111", borderRadius: "7px", padding: "12px 14px" }}>
                        <div style={{ fontSize: "10px", color: g.color, textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: "7px" }}>{g.title}</div>
                        <input value={(weeklyTargets[weekKey] || {})[g.id] || ""} onChange={e => setWeeklyTargets(p => ({ ...p, [weekKey]: { ...(p[weekKey] || {}), [g.id]: e.target.value } }))} placeholder={`#1 goal for ${g.id} this week?`} style={{ width: "100%", background: "transparent", border: "none", borderBottom: "1px solid rgba(255,255,255,0.06)", color: "#ccc", fontSize: "12px", padding: "3px 0 6px", outline: "none", fontFamily: "inherit" }} />
                      </div>
                    ))}
                  </div>
                  <div style={{ paddingTop: "16px", borderTop: "1px solid rgba(255,255,255,0.05)" }}>
                    <div style={{ fontSize: "10px", color: "#2a2a2a", textTransform: "uppercase", letterSpacing: "0.1em", marginBottom: "12px" }}>Weekly Review</div>
                    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "8px" }}>
                      {[
                        { key: "needle", prompt: "What moved the needle most?" },
                        { key: "wasted", prompt: "What was wasted time?" },
                        { key: "doubleDown", prompt: "What should you double down on?" },
                        { key: "stop", prompt: "What should you stop completely?" },
                      ].map(({ key, prompt }) => (
                        <div key={key} style={{ background: "#111", borderRadius: "7px", padding: "11px 13px" }}>
                          <div style={{ fontSize: "10px", color: "#333", marginBottom: "6px" }}>{prompt}</div>
                          <textarea value={(weeklyReview[weekKey] || {})[key] || ""} onChange={e => setWeeklyReview(p => ({ ...p, [weekKey]: { ...(p[weekKey] || {}), [key]: e.target.value } }))} style={{ width: "100%", background: "transparent", border: "none", color: "#888", fontSize: "12px", resize: "none", height: "54px", outline: "none", fontFamily: "inherit", lineHeight: 1.5 }} />
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
                <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(186px, 1fr))", gap: "10px", marginBottom: "36px" }}>
                  {[
                    { day: "Mon", color: "#f59e0b", tasks: ["Deep work: Build (2hr min)", "5 cold outreach messages", "Portfolio project sprint"] },
                    { day: "Tue", color: "#ef4444", tasks: ["Film YouTube content", "Customer discovery call", "Read 30 pages + 1 insight"] },
                    { day: "Wed", color: "#8b5cf6", tasks: ["AI tool experimentation", "Major project progress", "LinkedIn/GitHub update"] },
                    { day: "Thu", color: "#3b82f6", tasks: ["Business: validate or build", "Cold email batch + follow-ups", "Deep work: Create (2hr min)"] },
                    { day: "Fri", color: "#10b981", tasks: ["Ship something publicly", "Weekly metrics review", "Plan next week's targets"] },
                    { day: "Sat", color: "#f97316", tasks: ["Long deep build session (3hr)", "Read long-form / books", "What moved the needle?"] },
                    { day: "Sun", color: "#555", tasks: ["Rest intentionally", "6 review questions below", "Set Monday's #1 priority"] },
                  ].map(d => (
                    <div key={d.day} style={{ background: "#0d0d0d", border: "1px solid rgba(255,255,255,0.05)", borderRadius: "10px", padding: "18px 16px" }}>
                      <div style={{ fontSize: "13px", fontWeight: "600", color: d.color, marginBottom: "14px" }}>{d.day}</div>
                      {d.tasks.map((t, i) => <div key={i} style={{ fontSize: "12px", color: "#333", marginBottom: "7px", lineHeight: 1.45 }}>{t}</div>)}
                    </div>
                  ))}
                </div>
                <div style={{ background: "#0d0d0d", border: "1px solid rgba(255,255,255,0.05)", borderRadius: "12px", padding: "28px" }}>
                  <div style={{ fontSize: "11px", color: "#10b981", textTransform: "uppercase", letterSpacing: "0.1em", fontWeight: "600", marginBottom: "24px" }}>Sunday Review · 6 Questions — no exceptions</div>
                  {[
                    "What was my #1 highest-leverage action this week? Did I do enough of it?",
                    "What did I avoid that I know I should have done? Why? How do I remove that blocker?",
                    "What is the evidence that I am becoming who I said I'd become?",
                    "If I repeat this exact week 52 times, do I hit my July 2026 targets? If not, what changes?",
                    "Who did I add value to? Did I invest in any compounding relationships?",
                    "What's the one thing that, if done consistently, makes everything else easier?",
                  ].map((q, i) => (
                    <div key={i} style={{ display: "flex", gap: "18px", marginBottom: i < 5 ? "16px" : 0, alignItems: "flex-start" }}>
                      <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: "11px", color: "#10b981", flexShrink: 0, paddingTop: "3px" }}>Q{i + 1}</span>
                      <span style={{ fontSize: "13px", color: "#3a3a3a", lineHeight: 1.7 }}>{q}</span>
                    </div>
                  ))}
                </div>

                {/* Past Weeks Archive */}
                {(() => {
                  const allWeeks = [...new Set([...Object.keys(weeklyTargets), ...Object.keys(weeklyReview)])].filter(k => k !== weekKey).sort().reverse();
                  if (allWeeks.length === 0) return null;
                  return (
                    <div style={{ marginTop: "28px" }}>
                      <div style={{ fontSize: "10px", color: "#2a2a2a", textTransform: "uppercase", letterSpacing: "0.12em", fontWeight: "500", marginBottom: "12px" }}>Past Weeks · {allWeeks.length} archived</div>
                      <div style={{ display: "flex", flexDirection: "column", gap: "6px" }}>
                        {allWeeks.map(wk => {
                          const targets = weeklyTargets[wk] || {};
                          const review = weeklyReview[wk] || {};
                          const isOpen = historyWeekOpen === wk;
                          const hasContent = Object.values(targets).some(Boolean) || Object.values(review).some(Boolean);
                          if (!hasContent) return null;
                          return (
                            <div key={wk} style={{ background: "#0d0d0d", border: "1px solid rgba(255,255,255,0.05)", borderRadius: "10px", overflow: "hidden" }}>
                              <div onClick={() => setHistoryWeekOpen(isOpen ? null : wk)} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "14px 20px", cursor: "pointer" }}>
                                <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: "12px", color: "#444" }}>{wk}</span>
                                <div style={{ display: "flex", alignItems: "center", gap: "12px" }}>
                                  {Object.values(review).filter(Boolean).length > 0 && <span style={{ fontSize: "10px", color: "#10b981" }}>✓ reviewed</span>}
                                  <span style={{ fontSize: "11px", color: "#2a2a2a" }}>{isOpen ? "↑" : "↓"}</span>
                                </div>
                              </div>
                              {isOpen && (
                                <div style={{ padding: "0 20px 20px", borderTop: "1px solid rgba(255,255,255,0.04)" }}>
                                  {Object.values(targets).some(Boolean) && (
                                    <div style={{ marginTop: "16px", marginBottom: "16px" }}>
                                      <div style={{ fontSize: "10px", color: "#2a2a2a", textTransform: "uppercase", letterSpacing: "0.1em", marginBottom: "10px" }}>Targets</div>
                                      <div style={{ display: "flex", flexDirection: "column", gap: "7px" }}>
                                        {Object.entries(targets).map(([goalId, target]) => {
                                          if (!target) return null;
                                          const g = goals.find(g => g.id === goalId);
                                          return (
                                            <div key={goalId} style={{ display: "flex", gap: "12px", alignItems: "flex-start" }}>
                                              <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: "9px", color: g ? g.color : "#444", flexShrink: 0, paddingTop: "3px", textTransform: "uppercase", letterSpacing: "0.06em" }}>{goalId}</span>
                                              <span style={{ fontSize: "12px", color: "#444", lineHeight: 1.55 }}>{target}</span>
                                            </div>
                                          );
                                        })}
                                      </div>
                                    </div>
                                  )}
                                  {Object.values(review).some(Boolean) && (
                                    <div style={{ paddingTop: "14px", borderTop: "1px solid rgba(255,255,255,0.04)" }}>
                                      <div style={{ fontSize: "10px", color: "#2a2a2a", textTransform: "uppercase", letterSpacing: "0.1em", marginBottom: "12px" }}>Review</div>
                                      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "10px" }}>
                                        {[["needle", "Moved the needle"], ["wasted", "Wasted time"], ["doubleDown", "Double down on"], ["stop", "Stop completely"]].map(([key, label]) => review[key] ? (
                                          <div key={key}>
                                            <div style={{ fontSize: "10px", color: "#1e1e1e", marginBottom: "4px", textTransform: "uppercase", letterSpacing: "0.08em" }}>{label}</div>
                                            <div style={{ fontSize: "12px", color: "#3a3a3a", lineHeight: 1.6 }}>{review[key]}</div>
                                          </div>
                                        ) : null)}
                                      </div>
                                    </div>
                                  )}
                                </div>
                              )}
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  );
                })()}
              </div>
            )}

            {activeTab === "wisdom" && (
              <div style={{ animation: "fadeUp 0.22s ease" }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end", marginBottom: "28px" }}>
                  <div>
                    <div style={{ fontSize: "20px", fontWeight: "600", color: "#f0f0f0", letterSpacing: "-0.03em", marginBottom: "5px" }}>Collected Wisdom</div>
                    <div style={{ fontSize: "12px", color: "#333" }}>Mental models, principles & quotes — distilled from the books that shaped how I think</div>
                  </div>
                  <div style={{ textAlign: "right", flexShrink: 0 }}>
                    <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: "22px", fontWeight: "600", color: "#c9a84c", lineHeight: 1 }}>{WISDOM.reduce((a, s) => a + s.entries.reduce((b, e) => b + (e.type === "models" ? e.items.length : 1), 0), 0)}</div>
                    <div style={{ fontSize: "10px", color: "#2a2a2a", marginTop: "4px", textTransform: "uppercase", letterSpacing: "0.08em" }}>entries</div>
                  </div>
                </div>

                <div style={{ display: "flex", flexWrap: "wrap", gap: "6px", marginBottom: "44px" }}>
                  <button onClick={() => setWisdomFilter(null)} style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: "10px", letterSpacing: "0.08em", textTransform: "uppercase", padding: "6px 16px", background: wisdomFilter === null ? "rgba(255,255,255,0.07)" : "none", border: `1px solid ${wisdomFilter === null ? "rgba(255,255,255,0.16)" : "rgba(255,255,255,0.07)"}`, borderRadius: "100px", color: wisdomFilter === null ? "#e0e0e0" : "#333", cursor: "pointer", transition: "all 0.15s" }}>All</button>
                  {WISDOM.map(s => (
                    <button key={s.id} onClick={() => setWisdomFilter(wisdomFilter === s.id ? null : s.id)} style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: "10px", letterSpacing: "0.08em", textTransform: "uppercase", padding: "6px 16px", background: wisdomFilter === s.id ? `${s.color}18` : "none", border: `1px solid ${wisdomFilter === s.id ? s.color + "55" : "rgba(255,255,255,0.07)"}`, borderRadius: "100px", color: wisdomFilter === s.id ? s.color : "#333", cursor: "pointer", transition: "all 0.15s" }}>{s.icon} {s.title}</button>
                  ))}
                </div>

                {WISDOM.filter(s => !wisdomFilter || s.id === wisdomFilter).map(section => (
                  <div key={section.id} style={{ marginBottom: "60px" }}>
                    <div style={{ display: "flex", alignItems: "center", gap: "14px", paddingBottom: "16px", borderBottom: "1px solid rgba(255,255,255,0.05)", marginBottom: "10px" }}>
                      <div style={{ width: "36px", height: "36px", borderRadius: "10px", background: `${section.color}14`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: "17px", flexShrink: 0 }}>{section.icon}</div>
                      <div style={{ flex: 1 }}>
                        <div style={{ fontSize: "16px", fontWeight: "600", color: "#f0f0f0", letterSpacing: "-0.02em" }}>{section.title}</div>
                      </div>
                      <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: "10px", color: "#222", letterSpacing: "0.05em" }}>{section.entries.reduce((a, e) => a + (e.type === "models" ? e.items.length : 1), 0)} entries</span>
                    </div>
                    <div style={{ fontSize: "12px", color: "#2a2a2a", fontStyle: "italic", marginBottom: "18px" }}>{section.desc}</div>

                    <div style={{ display: "flex", flexDirection: "column", gap: "8px" }}>
                      {section.entries.map((entry, ei) => entry.type === "quote" ? (
                        <div key={ei} style={{ border: "1px dashed rgba(255,255,255,0.06)", borderLeft: `3px solid ${section.color}45`, borderRadius: "10px", padding: "16px 20px" }}>
                          <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: "9px", letterSpacing: "0.12em", textTransform: "uppercase", color: section.color, marginBottom: "9px", opacity: 0.8 }}>{entry.source}</div>
                          <div style={{ fontSize: "14px", color: "#888", fontStyle: "italic", lineHeight: 1.7 }}>"{entry.text}"</div>
                        </div>
                      ) : (
                        <div key={ei} style={{ background: "#0d0d0d", border: "1px solid rgba(255,255,255,0.05)", borderLeft: `3px solid ${section.color}50`, borderRadius: "10px", padding: "18px 20px" }}>
                          <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: "9px", letterSpacing: "0.1em", textTransform: "uppercase", color: section.color, marginBottom: "14px", opacity: 0.85 }}>{entry.source}</div>
                          {entry.items.map((item, ii) => (
                            <div key={ii}>
                              {ii > 0 && <div style={{ height: "1px", background: "rgba(255,255,255,0.04)", margin: "10px 0" }} />}
                              <div style={{ display: "flex", gap: "10px", alignItems: "flex-start" }}>
                                <div style={{ width: "4px", height: "4px", borderRadius: "50%", background: section.color, marginTop: "7px", flexShrink: 0, opacity: 0.6 }} />
                                <div style={{ flex: 1 }}>
                                  <span style={{ fontSize: "12px", fontWeight: "500", color: section.color + "cc" }}>{item.name}</span>
                                  <span style={{ fontSize: "12px", color: "#3a3a3a" }}> — {item.desc}</span>
                                </div>
                              </div>
                            </div>
                          ))}
                        </div>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            )}

            <footer style={{ marginTop: "64px", paddingTop: "18px", borderTop: "1px solid rgba(255,255,255,0.04)", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <div style={{ fontSize: "11px", color: "#1e1e1e" }}>Life OS · {overallPct}% complete</div>
              <div style={{ display: "flex", gap: "20px", alignItems: "center" }}>
                {achievements.length > 0 && (
                  <div style={{ display: "flex", gap: "8px" }}>
                    {ACHIEVEMENT_DEFS.filter(a => achievements.includes(a.id)).map(a => (
                      <span key={a.id} style={{ fontSize: "10px", color: "#6366f1", background: "rgba(99,102,241,0.1)", padding: "3px 10px", borderRadius: "20px", fontWeight: "500" }}>{a.label}</span>
                    ))}
                  </div>
                )}
                <div style={{ fontSize: "11px", color: "#1e1e1e" }}></div>
              </div>
            </footer>

          </div>
        </div>
      );
    }

    const PASSWORD = "iloveai69";

    function LoginScreen({ onAuth }) {
      const [input, setInput] = useState("");
      const [error, setError] = useState(false);
      const [shake, setShake] = useState(false);

      const attempt = () => {
        if (input === PASSWORD) {
          localStorage.setItem("lmos_auth", "1");
          onAuth();
        } else {
          setError(true);
          setShake(true);
          setTimeout(() => setShake(false), 500);
          setInput("");
        }
      };

      return (
        <div style={{ minHeight: "100vh", background: "#080808", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "'Inter', -apple-system, sans-serif" }}>
          <style>{`
            @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
            @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 40%{transform:translateX(8px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(5px)} }
            .shake { animation: shake 0.45s ease; }
          `}</style>
          <div style={{ textAlign: "center" }}>
            <div style={{ fontSize: "11px", color: "#333", letterSpacing: "0.14em", textTransform: "uppercase", fontWeight: "500", marginBottom: "32px" }}>Life OS · Jack Moloney</div>
            <div className={shake ? "shake" : ""} style={{ display: "flex", flexDirection: "column", gap: "12px", alignItems: "center" }}>
              <input
                type="password"
                value={input}
                onChange={e => { setInput(e.target.value); setError(false); }}
                onKeyDown={e => e.key === "Enter" && attempt()}
                placeholder="password"
                autoFocus
                style={{
                  background: error ? "rgba(239,68,68,0.06)" : "#0d0d0d",
                  border: `1px solid ${error ? "rgba(239,68,68,0.4)" : "rgba(255,255,255,0.08)"}`,
                  borderRadius: "8px",
                  padding: "12px 18px",
                  color: "#e0e0e0",
                  fontSize: "14px",
                  width: "220px",
                  outline: "none",
                  textAlign: "center",
                  letterSpacing: "0.1em",
                  transition: "border 0.2s",
                }}
              />
              <button
                onClick={attempt}
                style={{
                  background: "none",
                  border: "1px solid rgba(99,102,241,0.35)",
                  borderRadius: "8px",
                  color: "#6366f1",
                  fontSize: "12px",
                  fontWeight: "500",
                  padding: "9px 28px",
                  letterSpacing: "0.06em",
                  cursor: "pointer",
                  transition: "opacity 0.15s",
                }}
              >Enter</button>
              {error && <div style={{ fontSize: "11px", color: "rgba(239,68,68,0.7)", letterSpacing: "0.05em" }}>incorrect password</div>}
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [authed, setAuthed] = useState(!!localStorage.getItem("lmos_auth"));
      if (!authed) return <LoginScreen onAuth={() => setAuthed(true)} />;
      return <LifeMax />;
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
